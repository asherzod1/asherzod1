<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Sherzod Abdumutalov profile header</title>
  <desc id="description">A graphite header with an SA monogram, Sherzod Abdumutalov's name, role, and a restrained five-layer cyan architecture motif.</desc>
  <rect width="1200" height="280" fill="#10171d"/>
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" stroke="#2b3a42"/>

  <path d="M56 48H194" stroke="#38d9d0" stroke-width="3"/>
  <path d="M206 48H384" stroke="#60717a" stroke-width="1"/>
  <text x="56" y="128" fill="#f4f7f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" letter-spacing="0">SA<tspan fill="#38d9d0">.</tspan></text>
  <text x="57" y="190" fill="#f4f7f8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="0">Sherzod Abdumutalov</text>
  <text x="58" y="226" fill="#aab7bd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="0">Software Development Team Lead</text>

  <g fill="none" stroke="#38d9d0">
    <rect x="834" y="50" width="280" height="180" opacity="0.18"/>
    <rect x="858" y="68" width="232" height="144" opacity="0.25"/>
    <rect x="882" y="86" width="184" height="108" opacity="0.34"/>
    <rect x="906" y="104" width="136" height="72" opacity="0.48"/>
    <rect x="930" y="122" width="88" height="36" opacity="0.72"/>
  </g>
  <rect x="966" y="134" width="16" height="12" fill="#38d9d0"/>
  <path d="M742 140H834M1114 140H1160" stroke="#60717a"/>
  <circle cx="742" cy="140" r="3" fill="#38d9d0"/>
  <circle cx="1160" cy="140" r="3" fill="#38d9d0"/>
  <text x="834" y="252" fill="#73848c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0">ARCHITECTURE CORE / 05 LAYERS</text>
</svg>
